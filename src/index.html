<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HCM Lite — AI-assisted HR</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="HCM Lite — AI-assisted Human Capital Management for Admin, HR and Employee self-service.">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint (no light/dark flash).
    try {
      var saved = localStorage.getItem('hcm-theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <style>
    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    html.dark .boot { background: #020617; }
    .boot-mark { width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, #10b981, #0d9488); display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 26px; box-shadow: 0 18px 40px -16px rgba(16, 185, 129, .7); animation: boot-pulse 1.4s ease-in-out infinite; }
    .boot-text { margin-top: 16px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #64748b; font-weight: 600; text-align: center; }
    @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(.92); } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot">
      <div>
        <div class="boot-mark" style="margin: 0 auto">H</div>
        <div class="boot-text">HCM Lite</div>
      </div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to use HCM Lite.</noscript>
</body>
</html>
