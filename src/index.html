<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HCM Lite — AI-assisted HR</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="HCM Lite — AI-assisted Human Capital Management for Admin, HR and Employee self-service.">
  <meta name="theme-color" content="#F7F7F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Light by default; dark only when the user chose it (applied before first paint, no flash).
    try {
      if (localStorage.getItem('hcm-theme') === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <style>
    .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f7f8; font-family: Geist, system-ui, sans-serif; }
    html.dark .boot { background: #0b0c0f; }
    .boot-mark { display: block; width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 10px 28px -10px rgba(59, 130, 246, .6); animation: boot-fade 1.2s ease-in-out infinite; }
    .boot-text { margin-top: 12px; font-size: 13px; color: #6b6e77; font-weight: 500; text-align: center; }
    @keyframes boot-fade { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot">
      <div>
        <img class="boot-mark" src="favicon.svg" alt="" style="margin: 0 auto" />
        <div class="boot-text">HCM Lite</div>
      </div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to use HCM Lite.</noscript>
</body>
</html>
